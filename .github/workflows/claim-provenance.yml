name: Claim provenance migration

on: [push, pull_request]

permissions:
  contents: read

jobs:
  claim-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate core registry
        run: python3 registry/validate.py

      - name: Validate claim evidence
        run: python3 registry/validate_claim_evidence.py

      - name: Build normal site
        run: python3 site/build.py

      - name: Render one-record provenance migration preview
        run: python3 site/claim_evidence_preview.py

      - name: Assert migration-preview rendering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('site/dist/bills/tn-sb837-2025/index.html')
          h=p.read_text()
          required=[
            'Claim evidence',
            '(migration preview)',
            'effective_date',
            '2026-04-23',
            'Tennessee Secretary of State — Public Chapter 781',
            'Tennessee General Assembly — SB 837 bill history',
            'Tenn. Code Ann. § 1-3-105(a)(20), as amended by Pub. Ch. 781 (2026)',
          ]
          missing=[x for x in required if x not in h]
          if missing:
              raise SystemExit('claim-evidence render missing: '+repr(missing))
          print('claim provenance migration preview: PASS')
          PY
