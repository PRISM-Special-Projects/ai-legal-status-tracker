name: Claim provenance migration

on: [push, pull_request]

permissions:
  contents: read

jobs:
  claim-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate core registry
        run: python3 registry/validate.py

      - name: Validate claim evidence
        run: python3 registry/validate_claim_evidence.py

      - name: Diagnose unpinned differ corpus texts
        run: python3 registry/diagnose_g3_diff.py
