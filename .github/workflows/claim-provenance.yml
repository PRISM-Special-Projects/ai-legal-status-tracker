name: Claim provenance migration

on: [push]

permissions:
  contents: write

jobs:
  claim-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply G8 substantive status corrections
        run: python3 registry/fix_g8_statuses.py
      - name: Validate core registry
        run: python3 registry/validate.py
      - name: Validate claim evidence
        run: python3 registry/validate_claim_evidence.py
      - name: Build site
        run: python3 site/build.py
      - name: Commit corrected tracker data
        run: |
          if ! git diff --quiet -- registry/bills.json registry/claim_evidence.json registry/source_catalog.json; then
            git config user.name "registry-audit"
            git config user.email "registry-audit@users.noreply.github.com"
            git add registry/bills.json registry/claim_evidence.json registry/source_catalog.json
            git commit -m "Correct Oklahoma and South Carolina terminal statuses"
            git push
          fi
