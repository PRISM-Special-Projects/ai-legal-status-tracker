name: Claim provenance migration

on: [push]

permissions:
  contents: write

jobs:
  claim-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply I publication cleanup
        run: python3 registry/fix_i_publication_caveats.py
      - name: Validate core registry
        run: python3 registry/validate.py
      - name: Publication audit
        run: python3 registry/publication_audit.py
      - name: Regression tests
        run: python3 registry/test_regressions.py
      - name: Validate claim evidence
        run: python3 registry/validate_claim_evidence.py
      - name: Build site
        run: python3 site/build.py
      - name: Commit I publication cleanup
        run: |
          if ! git diff --quiet -- registry/bills.json; then
            git config user.name "registry-audit"
            git config user.email "registry-audit@users.noreply.github.com"
            git add registry/bills.json
            git commit -m "Resolve publication audit caveats"
            git push
          fi
