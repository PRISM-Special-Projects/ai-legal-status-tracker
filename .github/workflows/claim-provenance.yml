name: Claim provenance migration

on: [push, pull_request]

permissions:
  contents: read

jobs:
  claim-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF text extractor
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils

      - name: Regenerate G3 normalized texts in workspace
        run: python3 registry/apply_g3_texts.py

      - name: Refresh G3 text hashes in workspace
        run: python3 registry/apply_g3_registry.py

      - name: Validate core registry
        run: python3 registry/validate.py

      - name: Validate claim evidence
        run: python3 registry/validate_claim_evidence.py

      - name: Diagnose corrected G3 differ corpus texts
        run: python3 registry/diagnose_g3_diff.py
