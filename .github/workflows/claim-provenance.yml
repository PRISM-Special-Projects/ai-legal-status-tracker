name: Claim provenance migration

on: [push, pull_request]

permissions:
  contents: write

jobs:
  claim-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Acquire G3 Missouri SB 1012 texts
        run: python3 registry/apply_g3_texts.py

      - name: Commit acquired G3 texts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add registry/incoming/mo-sb1012-2026--*.pdf registry/texts/mo-sb1012-2026--*.txt
          if git diff --cached --quiet; then echo 'No G3 text changes.'; exit 0; fi
          git commit -m 'Store official Missouri SB 1012 text states'
          git push
