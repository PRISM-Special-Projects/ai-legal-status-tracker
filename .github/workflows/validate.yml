name: Validate and build

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The registry and the site builder import only the standard library, and
      # that is a property worth protecting: nothing below installs a runtime
      # dependency. Ruff is a lint tool, run in its own job so this one stays
      # pip-free and proves the build needs nothing.

      - name: Validate registry
        run: python3 registry/validate.py

      - name: Regression tests
        run: python3 registry/test_regressions.py

      - name: Differ tests
        run: python3 site/test_diff.py

      - name: Audit instrument tests
        run: python3 audit/test_audit.py

      - name: Build site
        run: python3 site/build.py

      - name: Post-build assertions
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, csv, sys
          fail=[]
          reg=json.load(open("registry/bills.json")); bills=reg["bills"]

          pages=[f for r,_,fs in os.walk("site/dist") for f in fs if f.endswith(".html")]
          if len(pages) != len(bills)+4:
              fail.append(f"expected {len(bills)+4} pages, got {len(pages)}")

          for root,_,files in os.walk("site/dist"):
              for f in files:
                  if not f.endswith(".html"): continue
                  h=pathlib.Path(root,f).read_text()
                  for m in re.findall(r'href="(?!https?:|#|mailto:)([^"]+)"', h):
                      t=m.split("#")[0]
                      if not t: continue
                      pth=os.path.normpath(os.path.join(root,t))
                      if os.path.isdir(pth): pth=os.path.join(pth,"index.html")
                      if not os.path.exists(pth): fail.append(f"broken link {root}/{f} -> {m}")
                  if "http://" in h or re.search(r'(?:src|href)="https?://[^"]+"', h) and "/bills/" not in root and "lineage" not in root and "method" not in root and "data" not in root:
                      pass

          for b in bills:
              for v in b["versions"]:
                  tp=v.get("text_path")
                  if tp and not os.path.exists(os.path.join("registry",tp)):
                      fail.append(f"{b['id']}: missing text {tp}")

          rows=list(csv.DictReader(open("site/dist/data/bills.csv")))
          if len(rows)!=len(bills): fail.append(f"bills.csv {len(rows)} rows vs {len(bills)} records")

          # ---- state map. The registry decides what is on the map; the map never decides.
          home=pathlib.Path("site/dist/index.html").read_text()
          counts={}
          for b in bills:
              s=b["jurisdiction"]["state"]; counts[s]=counts.get(s,0)+1

          shapes=re.findall(r'<(?:g|path)[^>]*class="st\b', home)
          if len(shapes)!=51:
              fail.append(f"state map: expected 51 state shapes (50 + DC), got {len(shapes)}")

          interactive=set(re.findall(r'class="st has"[^>]*data-state="([A-Z]{2})"', home))
          if interactive!=set(counts):
              fail.append(f"state map: interactive states {sorted(interactive)} "
                          f"!= registry states {sorted(counts)}")
          for st,n in counts.items():
              want=f'{n} bill{"" if n==1 else "s"}. Filter."'
              if want not in home or f'data-state="{st}"' not in home:
                  fail.append(f"state map: {st} is not labelled with {n} bill(s)")
          listbtns=set(re.findall(r'class="mrow" data-state="([A-Z]{2})"', home))
          if listbtns!=set(counts):
              fail.append(f"state map: fallback list {sorted(listbtns)} != registry {sorted(counts)}")

          # Descriptive-first, mechanically: categorical fill only. Two CSS rules carry the
          # two fills, so any per-state fill or gradient means a ramp has crept in.
          css=pathlib.Path("site/dist/style.css").read_text()
          svg=home[home.find('<svg class="usmap"'):home.find('</svg>')]
          if re.search(r'<(linear|radial)Gradient', svg):
              fail.append("state map: a gradient is present; fill must be categorical")
          if re.search(r'<(?:g|path)[^>]*\bfill=', svg) or "fill-opacity" in svg:
              fail.append("state map: per-shape fill attribute; fill must come from the two CSS rules")
          # [^;}]+ not [^;]+ — a rule with no trailing semicolon lets a greedy class run
          # past the closing brace and swallow the next rule, which silently merges two
          # fills into one match and would let a real ramp through.
          fills=re.findall(r'\.usmap \.st(?:\.has)? path\{fill:([^;}]+)', css)
          if len(set(fills))>2:
              fail.append(f"state map: {len(set(fills))} distinct state fills; at most 2 allowed")

          if "not the same as none existing" not in home:
              fail.append("state map: the absence caveat is missing")

          if not os.path.exists("site/geo/LICENSE-us-atlas"):
              fail.append("site/geo/LICENSE-us-atlas is missing; ISC requires the notice to ship")
          if "LICENSE-us-atlas" not in pathlib.Path("LICENSE-DATA").read_text():
              fail.append("LICENSE-DATA does not account for the vendored geometry")

          # every provision used must be documented in SCHEMA.md
          schema=pathlib.Path("SCHEMA.md").read_text()
          used={p for b in bills for p in b["provisions"]}
          for p in sorted(used):
              if f"`{p}`" not in schema: fail.append(f"provision '{p}' used but not documented in SCHEMA.md")

          # no evaluative language in the structured fields
          BAD=r"soften|degrad|overbroad|generous in form|made up its mind|weaken|remarkable"
          for b in bills:
              blob=" ".join(b["derived_from_changes"])
              m=re.search(BAD, blob, re.I)
              if m: fail.append(f"{b['id']}: evaluative language in derived_from_changes: {m.group()}")

          # Every rendered diff must declare how it was produced, so a fallback
          # comparison can never be mistaken for a structural one.
          import glob
          for f in glob.glob("site/dist/bills/*/index.html"):
              h=pathlib.Path(f).read_text()
              if 'class="diff"' in h and "Comparison method:" not in h:
                  fail.append(f"{f}: diff rendered without a comparison-method statement")

          print("\n".join(fail) if fail else "all post-build assertions passed")
          sys.exit(1 if fail else 0)
          PY

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # A deliberately narrow rule set: dead imports, undefined names, syntax
      # errors. This is here to catch residue after a refactor — the previous
      # differ rewrite left an unused import behind — not to enforce a style.
      - run: pip install ruff==0.6.9
      - run: ruff check --select F,E9 registry site audit
