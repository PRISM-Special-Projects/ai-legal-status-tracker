name: Validate and build

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate registry
        run: python3 registry/validate.py

      - name: Publication audit
        run: python3 registry/publication_audit.py

      - name: Regression tests
        run: python3 registry/test_regressions.py

      # Structural differ perfection is useful technical quality work, but under
      # the tracker-focused release plan it is not a release blocker unless it
      # prevents substantive bill/status/text verification. Keep reporting it.
      - name: Differ tests (technical quality, non-blocking)
        run: python3 site/test_diff.py
        continue-on-error: true

      - name: Audit instrument tests
        run: python3 audit/test_audit.py

      - name: Build site
        run: python3 site/build.py

      - name: Post-build assertions
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, csv, sys
          fail=[]
          reg=json.load(open("registry/bills.json")); bills=reg["bills"]
          pages=[f for r,_,fs in os.walk("site/dist") for f in fs if f.endswith(".html")]
          if len(pages) != len(bills)+4: fail.append(f"expected {len(bills)+4} pages, got {len(pages)}")
          for b in bills:
              for v in b["versions"]:
                  tp=v.get("text_path")
                  if tp and not os.path.exists(os.path.join("registry",tp)):
                      fail.append(f"{b['id']}: missing text {tp}")
          rows=list(csv.DictReader(open("site/dist/data/bills.csv")))
          if len(rows)!=len(bills): fail.append(f"bills.csv {len(rows)} rows vs {len(bills)} records")
          home=pathlib.Path("site/dist/index.html").read_text()
          counts={}
          for b in bills:
              s=b["jurisdiction"]["state"]; counts[s]=counts.get(s,0)+1
          shapes=re.findall(r'<(?:g|path)[^>]*class="st\b', home)
          if len(shapes)!=51: fail.append(f"state map: expected 51 state shapes, got {len(shapes)}")
          interactive=set(re.findall(r'class="st has"[^>]*data-state="([A-Z]{2})"', home))
          if interactive!=set(counts): fail.append(f"state map mismatch: {sorted(interactive)} != {sorted(counts)}")
          schema=pathlib.Path("SCHEMA.md").read_text()
          used={p for b in bills for p in b["provisions"]}
          for p in sorted(used):
              if f"`{p}`" not in schema: fail.append(f"provision '{p}' used but not documented")
          BAD=r"soften|degrad|overbroad|generous in form|made up its mind|weaken|remarkable"
          for b in bills:
              m=re.search(BAD, " ".join(b["derived_from_changes"]), re.I)
              if m: fail.append(f"{b['id']}: evaluative language: {m.group()}")
          print("\n".join(fail) if fail else "all post-build assertions passed")
          sys.exit(1 if fail else 0)
          PY

      - name: Upload built site for local inspection
        uses: actions/upload-artifact@v4
        with:
          name: built-site
          path: site/dist
          retention-days: 1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff==0.6.9
      - run: ruff check --select F,E9 registry site audit
